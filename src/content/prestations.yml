prestations:
  - titre: Moteur
    texte: Diagnostic, carburation, réglages et remise en état. Je cherche d'abord d'où vient le problème, avant de remplacer quoi que ce soit.
    photo: /src/assets/photos/moteur-883.jpg
    photo_description: Moteur de Harley-Davidson Sportster 883 dans mon atelier
  - titre: Entretien
    texte: Vidange, chaîne, pneus, freins et révision complète. C'est ce qui coûte le moins cher, et c'est ce qui évite le reste.
    photo: /src/assets/photos/atelier-etabli.jpg
    photo_description: Carburateurs et bas moteur démontés sur mon établi
  - titre: Partie cycle
    texte: Freins, suspensions, direction et transmission. Une ancienne qui freine bien et qui tient la route, ça se règle.
    photo: /src/assets/photos/partie-cycle-bobber.jpg
    photo_description: Châssis de bobber en restauration sur mon pont
  - titre: Préparation et custom
    texte: "Cafe racer, bobber, scrambler, ou juste une selle, un guidon et un échappement qui changent tout. Vous arrivez avec une idée, on la met au point ensemble, la moto sous les yeux."
    photo: /src/assets/photos/atelier-motos.jpg
    photo_description: Cafe racer sur base BMW en préparation dans mon atelier
  - titre: Électricité
    texte: Batterie, charge, démarrage, éclairage, faisceau. C'est souvent là que se cachent les pannes qui n'ont l'air de rien.
    photo: /src/assets/photos/electricite-multimetre.jpg
    photo_description: Contrôle de la batterie au multimètre
  - titre: Carrosserie
    texte: Préparation et peinture des réservoirs et des pièces de carrosserie, à la teinte d'origine ou à celle de votre choix. C'est la dernière étape, et c'est celle qui se voit.
    photo: /src/assets/photos/carrosserie-triumph.jpg
    photo_description: Réservoir Triumph repeint dans mon atelier
