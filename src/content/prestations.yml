prestations:
  - titre: Mecanique
    texte: Diagnostic, carburation, réglages et remise en état. Restauration compléte de moteur, boite, cardan, tout ce qui touche a la mecanique.
    photo: /src/assets/photos/sam_5541.webp
    photo_description: Moteur de Harley-Davidson 1340
  - titre: Entretien
    texte: Vidange, chaîne, pneus, freins, révision complète, etc... Je fait le suivit de vos entretiens et surtout cela permet de faire vivre votre moto logtemps
    photo: /src/assets/photos/atelier-etabli.jpg
    photo_description: Carburateurs et bas moteur démontés sur mon établi
  - titre: Partie cycle
    texte: Freins, suspensions, direction et transmission, comme le montage de durite aviation, changement de guidon, changement d'amortisseur etc...
    photo: /src/assets/photos/partie-cycle-bobber.jpg
    photo_description: Châssis de bobber en restauration sur mon pont
  - titre: Préparation et custom
    texte: Chopper,Cafe racer, bobber, scrambler, modifier l'arriere d'un cadre, un guidon,  un échappement qui changent votre moto et la mets a votre gout. Vous arrivez avec une idée, on en discute et je la realise.
    photo: /src/assets/photos/20260624_210746.webp
    photo_description: scrambler sur base yamaha 600 xjn
  - titre: Électricité
    texte: Diagnostique électrique, batterie, faisceau electrique, controle des elements electriques et réparation la mieux adapter. Montage accessoirs comme des feux additionels
    photo: /src/assets/photos/electricite-multimetre.jpg
    photo_description: Contrôle de la batterie au multimètre
  - titre: Carrosserie
    texte: |-
      Réparation des éléments de carrosserie, peinture d'origine ou personalisé, ainsi que la sellerie.
      Vos idées peuvent prendre vie.
    photo: /src/assets/photos/carrosserie-triumph.jpg
    photo_description: Réparation reservoir de Triumph
