titre: Parlons de votre moto
texte: "Le plus simple, c'est de m'appeler : on parle de la moto et de ce qu'elle a. Vous pouvez aussi m'écrire sur Instagram ou Facebook, avec une photo."
telephone:
  titre: Téléphone et adresse
  consigne: Appelez avant de passer, je suis souvent sur une moto dans mon atelier.
reseaux:
  titre: Instagram et Facebook
  texte: Envoyez-moi une photo de votre moto et deux mots sur ce que vous voulez faire. Je vous réponds dès que je sors de l'atelier.
referencement:
  titre: Contact atelier moto Uriage
  description: Appelez-moi au {telephone} ou écrivez-moi sur Instagram ou Facebook. Atelier moto à Saint-Martin-d'Uriage, près de Grenoble.
