titre: Réparation, entretien et préparation
texte: 'De la vidange à la restauration complète, ou la modification,je travaile sur toutes les marques et toutes les cylindrées. Ma spécialité, ce sont les motos anciennes : je rechercher la panne avant de remplacer, et je vous dis ce qui presse et ce qui peut attendre. Toujours a votre écoute.'
appel:
  titre: Besoin d'un diagnostic ou d'un devis ?
  texte: Dites-moi le modèle, l'année et ce qui ne va pas. Je vous rappelle, et au besoin on regarde la moto ensemble à l'atelier.
referencement:
  titre: Réparation et préparation moto à Uriage
  description: "Réparation, entretien, restauration et custom de motos à Saint-Martin-d'Uriage, près de Grenoble : moteur, partie cycle, électricité, carrosserie."
