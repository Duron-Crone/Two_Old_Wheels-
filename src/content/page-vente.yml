titre: Vente et dépôt-vente de motos anciennes
texte: "Je vends et je prends en dépôt-vente des motos anciennes et vintage, toutes marques : routières, roadsters, cruisers, customs, tout-terrain. Chacune passe d'abord sur mon pont. Les disponibilités changent souvent : appelez-moi ou suivez l'atelier sur Instagram."
encarts:
  - titre: Acheter ou vendre
    texte: Vous cherchez un modèle précis ? Dites-le-moi, j'ouvre l'œil. Vous voulez vendre la vôtre ? Je peux la prendre en dépôt-vente et m'occuper des visites.
appel:
  titre: Une moto à vendre ou un modèle recherché ?
referencement:
  titre: Vente de motos vintage à Uriage
  description: "Vente et dépôt-vente de motos anciennes et vintage à Saint-Martin-d'Uriage, près de Grenoble : routières, roadsters, cruisers, customs, tout-terrain."
